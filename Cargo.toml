[workspace]
members = [
    "crates/folivm-core",
    "crates/folivm-native",
    "crates/folivm-wasm",
]
resolver = "2"

[workspace.dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"
uuid        = { version = "1", features = ["v4", "serde", "js"] }
postcard    = { version = "1", features = ["alloc"] }
anyhow      = "1"
thiserror   = "2"
pulldown-cmark = { version = "0.12", default-features = false }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true

# Used by: wasm-pack build --profile release-wasm
[profile.release-wasm]
inherits  = "release"
opt-level = "z"
